# 既知の差の一覧(計画 261024-1 の 8.1 節)。
# kconform は、ここに無い差が 1 件でもあれば失敗する。
# 各項目は、試験のパスの末尾、`  $ ` の行の番号、組、理由、台帳の番号を持つ。
#
# V213: OCAMLRUNPARAM=l=... で OCaml のスタックの上限を絞るブロックは、
# Diktor の木の評価器のスタックの限度を試すもので、語数を写さない。
# 同じ意図の試験は conformance/depth/ と conformance/frontend-depth/ に作り直す。
# 組 dk は本物の diktor をそのまま走らせるので、これらの項目に当たらない。
# 組 kf は M97 から型検査の呼び出しを keleut check で走らせるので、--type-check の呼び出しの項目に当たる。

