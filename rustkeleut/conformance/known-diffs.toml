# 既知の差分の一覧である。
# kconform は、登録のない差分が 1 件でもあれば失敗する。
# 各項目は、テストのパスの末尾、`  $ ` の行の番号、ペア、理由、台帳の番号を持つ。
# キー when と against は省略できる(conformance/README.md と crates/kconform/src/known_diffs.rs を参照)。
# reason の値は kconform が表示する文字列で、上限を「限度」、構文木の評価器を「木の評価器」、メモリ不足を「メモリの不足」、シェイプ表を「形の表」と書いている。
#
# V213: OCAMLRUNPARAM=l=... で OCaml のスタックの上限を下げるブロックは、Diktor の構文木の評価器が使うスタックの上限を確かめるもので、そのワード数はほかの処理系の上限に対応しない。
# 同じ意図のテストは、conformance/depth/ と conformance/frontend-depth/ に別に置いてある。
# ペア dk は本物の diktor をそのまま実行するので、これらの項目に該当しない。
# ペア kf は型検査の呼び出しを keleut check で実行するので、--type-check の呼び出しの項目に該当する。

