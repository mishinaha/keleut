# V213(conformance/depth/limit.t): LangSpec §15.5 は、評価に必要なメモリの上限の大きさを定めていないので、上限は処理系が決める(reason の `限度は I` はこのことを指す)。
# 各段の呼び出しを深い入れ子で囲み、OCAMLRUNPARAM で OCaml のスタックの上限を下げると、Diktor の KIR の評価器は、論理的な深さが上限に達する前に、スタックオーバーフローの実行時エラー(終了コード 3)で終了する(IRSpec 11.5 節)。
# conformance/depth/limit.t の期待出力は keleut run の結果である。

[[diff]]
file = "conformance/depth/limit.t"
line = 23
pairs = ["dk-ir", "x-ir"]
reason = "限度は I(§15.5)。Diktor の KIR の評価器は 4096 段ごとのファイバーのスタックの上限で止まる"
ledger = "V213"
against = "record"

