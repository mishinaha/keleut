# V240: レコードの拡張の連鎖を、仮想メモリを 512 MiB に制限して実行すると、keleut run はシェイプ表を拡張できず、メモリ不足の実行時エラー(終了コード 3)になる。
# Diktor は同じ制限をかけても終了コード 0 で終了するので、conformance/oom/shape.t の期待出力(keleut run の結果)と違う。
