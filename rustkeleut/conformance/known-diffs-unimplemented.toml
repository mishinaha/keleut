# 一時の既知の差: 評価が handle に届くブロック(M88 で登録し、M89 で消す。台帳 V219)。
#
# M88 の keleut run(インタプリタ)はエフェクトを持たず、評価が handle に届くと
# 「keleut: 未実装: handle」を書いて 4 で終わる(M86 の下ろしの約束)。
# 計画 261024-1 の 9 節の M88 の受け入れのとおり、そのブロックを「未実装 4」として一時的にここへ登録する。
# M89 でエフェクトを入れたら、このファイルを消す(kconform は conformance/known-diffs-*.toml も読む)。
#
# 項目は kconform --pairs dk,ki --suite all の結果から作った。
# when = "unimplemented" の項目は、組 ki の結果が「keleut: 未実装」の行を含み、
# その行より前の出力が比べる相手の先頭と一致するときだけ当たる。
# 未実装に届く前の出力の違いと、未実装に届かなくなったブロックの差は隠さない。
# when の無い 3 項目(invariants.t)は、標準エラーを捨てて 2 つの実行の終了状態と標準出力の一致だけを
# same/differ の 1 行で印字するブロックで、結果に診断の行が残らない。どれも with_stdout(プレリュードの handle)を通ることを確かめてある。

