[package]
name = "keleut-cli"
description = "RustKeleut のコマンド行の入口(バイナリ keleut)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "keleut"
path = "src/main.rs"

[dependencies]
keleut-front = { path = "../keleut-front" }
keleut-interp = { path = "../keleut-interp" }
keleut-lir = { path = "../keleut-lir" }
keleut-rt = { path = "../keleut-rt" }
kir = { path = "../kir" }
