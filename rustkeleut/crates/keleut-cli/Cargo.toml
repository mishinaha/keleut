[package]
name = "keleut-cli"
description = "RustKeleut のコマンド行の入口(バイナリ keleut)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "keleut"
path = "src/main.rs"

[dependencies]
keleut-front = { path = "../keleut-front" }
keleut-interp = { path = "../keleut-interp" }
keleut-lir = { path = "../keleut-lir" }
keleut-llvm = { path = "../keleut-llvm", default-features = false, optional = true }
keleut-rt = { path = "../keleut-rt" }
keleut-rtcore = { path = "../keleut-rtcore" }
keleut-wasm = { path = "../keleut-wasm" }
kir = { path = "../kir" }

[features]
# LLVM の後段は既定で組む(計画 6.1 節、P241)。
# `--no-default-features` で外すと、インタプリタと WasmGC だけの `keleut` になる。
default = ["llvm"]
# LLVM の後段(`keleut run --backend jit`、`keleut dump llvm`)。LLVM 22 の共有ライブラリに結合する。
llvm = ["dep:keleut-llvm", "keleut-llvm/llvm"]
